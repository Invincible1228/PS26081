[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megh-nwp"
version = "1.0.0"
description = "MEGH: Hybrid AI-NWP Meteorological Intelligence & Multi-Model Forecast Blending System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Invincible1228" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
]

[project.scripts]
megh = "run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
